[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drdetect"
version = "0.1.0"
description = "Explainable, quality-aware AI for diabetic retinopathy screening"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Adarsh Dwivedi" }]
keywords = [
    "diabetic-retinopathy", "medical-imaging", "explainable-ai",
    "deep-learning", "fundus", "computer-vision", "healthcare-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # --- deep learning ---
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
    "timm>=1.0",
    "monai>=1.3",
    "segmentation-models-pytorch>=0.3",
    # --- imaging / classical CV ---
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "albumentations>=1.4",
    "Pillow>=10.2",
    # --- data / numerics ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # --- metrics / tracking / config ---
    "torchmetrics>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    # --- explainability ---
    "grad-cam>=1.5",
    # --- simulation ---
    "simpy>=4.1",
    # --- reporting & serving ---
    "reportlab>=4.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "gradio>=4.25",
    # --- misc ---
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "kaggle>=1.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]

[project.urls]
Homepage = "https://github.com/adarshcod30/Diabetic-Retinopathy-Detection"
Issues = "https://github.com/adarshcod30/Diabetic-Retinopathy-Detection/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires a GPU",
    "data: requires downloaded datasets",
]
